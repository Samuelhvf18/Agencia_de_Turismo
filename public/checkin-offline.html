<!DOCTYPE html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Check-in sin conexión · Pipocas</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#163047;margin:0}main{max-width:700px;margin:auto;padding:24px}section{background:white;border:1px solid #dbe4ec;border-radius:16px;padding:22px;margin:18px 0}h1{font-size:26px}p,small{line-height:1.6;color:#536c7e}input,select,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box;max-width:100%}input,select{width:100%;margin:8px 0 14px}button{background:#1f5f8b;color:white;cursor:pointer}button.secondary{background:white;color:#1f5f8b}li{padding:12px 0;border-bottom:1px solid #edf2f7;list-style:none}ul{padding:0}#estado{padding:14px;background:#fff4d5;border-radius:10px;white-space:pre-wrap}label{font-weight:600}a{color:#1f5f8b}button:disabled{opacity:.5}[hidden]{display:none!important}</style>
<main><h1>Check-in sin conexión</h1><p>Desbloquea las salidas que preparaste en este dispositivo. Los escaneos offline son provisionales hasta sincronizar con el servidor.</p><p id="estado" role="status">Introduce tu clave local. No es la contraseña de tu cuenta.</p>
<section id="desbloquear"><form id="acceso"><label for="clave">Clave del dispositivo</label><input id="clave" type="password" minlength="12" required autocomplete="off"><button>Desbloquear</button></form></section>
<section id="trabajo" hidden><label for="salida">Salida preparada</label><select id="salida"></select><p id="vigencia"></p><form id="escanear"><label for="codigo">Código del boleto</label><input id="codigo" maxlength="64" required placeholder="BOL-…" autocomplete="off"><button>Registrar escaneo</button> <button type="button" id="camara" class="secondary">Usar cámara</button></form><video id="video" hidden playsinline style="width:100%"></video><p><button id="sincronizar">Sincronizar ahora</button> <button id="bloquear" class="secondary">Bloquear pantalla</button></p><h2>Pasajeros</h2><ul id="pasajeros"></ul><div id="conflictos" role="alert"></div></section>
<p><a href="/guias/checkin">Volver al panel con conexión</a></p><button id="eliminar" class="secondary">Eliminar datos de este dispositivo</button></main><script type="module" src="/js/checkin-offline.js"></script></html>
