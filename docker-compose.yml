# Despliegue completo: Nginx + PHP-FPM + PostgreSQL 17 + Redis + n8n,
# con un worker de colas y el planificador de Laravel. Ver docs/DESPLIEGUE.md.
services:
  app:
    build: { context: ., dockerfile: docker/Dockerfile, target: app }
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      PG_DUMP_PATH: pg_dump
    volumes:
      - storage:/var/www/html/storage
    depends_on: [db, redis]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on: [app]
    restart: unless-stopped

  # Envío de correos, notificaciones y boletos (colas de Laravel).
  queue:
    build: { context: ., dockerfile: docker/Dockerfile, target: app }
    env_file: .env
    environment: { DB_HOST: db, REDIS_HOST: redis, QUEUE_CONNECTION: redis, CACHE_STORE: redis }
    command: php artisan queue:work --tries=3 --backoff=30 --max-time=3600
    volumes: [storage:/var/www/html/storage]
    depends_on: [db, redis]
    restart: unless-stopped

  # Cron de Laravel: reservas:expirar (cada hora), recordatorios y respaldo:bd (diario).
  scheduler:
    build: { context: ., dockerfile: docker/Dockerfile, target: app }
    env_file: .env
    environment: { DB_HOST: db, REDIS_HOST: redis, CACHE_STORE: redis, PG_DUMP_PATH: pg_dump }
    command: php artisan schedule:work
    volumes: [storage:/var/www/html/storage]
    depends_on: [db, redis]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/La_Paz
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped

  # Planificador de IO II, notificaciones y chatbot (flujos en docs/n8n).
  n8n:
    image: n8nio/n8n:1.80.0
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: America/La_Paz
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      PIPOCAS_URL: ${APP_URL}
      PIPOCAS_N8N_TOKEN: ${N8N_TOKEN}
      PIPOCAS_MAIL_FROM: ${MAIL_FROM_ADDRESS}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes: [n8ndata:/home/node/.n8n]
    restart: unless-stopped

volumes:
  storage:
  pgdata:
  redisdata:
  n8ndata:
