server.port=${PORT:8081}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=pipocas-notificaciones
spring.datasource.url=${NOTIFICACIONES_DB_URL:jdbc:h2:file:./data/entregas}
spring.datasource.username=sa
spring.datasource.password=${NOTIFICACIONES_DB_PASSWORD:}
spring.sql.init.mode=always
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:pipocasprogra@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
pipocas.token=${NOTIFICACIONES_TOKEN:}
pipocas.from=${MAIL_FROM_ADDRESS:pipocasprogra@gmail.com}
